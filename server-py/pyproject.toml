[project]
name = "autoflow-platform"
version = "0.0.0"
description = "AutoFlow platform Python backend (FastAPI service)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "playwright>=1.49",
  "cryptography>=43",
  "openpyxl>=3.1",
  "starlette>=0.37",
]

# Dev/test-only dependencies. uv sync installs this group by default;
# production deploys use `uv sync --no-dev` to exclude it.
[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]
